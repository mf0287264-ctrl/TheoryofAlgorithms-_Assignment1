name: CI

on:
  push:
    branches: ["*"]

jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: list code
        run: ls

  Build:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-app:$(date +%s)

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Testing
        run: echo "testing"

  Release:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Push Docker image
        run: echo "pushing docker image"

        
      
      - name: Push Docker image
        run: echo "pushing docker image"
